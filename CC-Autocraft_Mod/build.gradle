plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'java'

    // В каждом подпроекте gradle.properties задаёт mc (версию) и loom.platform.
    def mc = project.property('mc') as String
    def javaVer = mc == '1.20.1' ? 17 : 21

    group = rootProject.maven_group
    version = "${rootProject.mod_version}+${mc}"
    base { archivesName = "${rootProject.mod_id}-${project.property('loom.platform')}" }

    repositories {
        maven { url = 'https://maven.blamejared.com/' }            // JEI
        maven { url = 'https://maven.terraformersmc.com/releases/' } // EMI
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://files.minecraftforge.net/maven/' }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${mc}"
        mappings loom.officialMojangMappings()
    }

    sourceSets.main {
        java.srcDirs += [rootProject.file('shared/src/main/java'), rootProject.file("common-${mc}/src/main/java")]
        resources.srcDirs += [rootProject.file('shared/src/main/resources')]
    }

    java {
        sourceCompatibility = JavaVersion.toVersion(javaVer)
        targetCompatibility = JavaVersion.toVersion(javaVer)
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = javaVer
    }

    processResources {
        def props = [version: project.version, mod_id: rootProject.mod_id, mod_name: rootProject.mod_name]
        inputs.properties props
        filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) { expand props }
    }
}

// Удобная задача: собрать все четыре jar-а и сложить в build/libs корня.
tasks.register('collectJars', Copy) {
    dependsOn subprojects.collect { it.tasks.named('remapJar') }
    from(subprojects.collect { it.tasks.named('remapJar') })
    into layout.buildDirectory.dir('libs')
}
